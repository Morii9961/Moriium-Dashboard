# 私网访问（例如 Tailscale）+ HTTPS + 登录。只在私网地址上监听，公网不可达。
# TAILNET_ADDRESS 换成这台机器的私网地址，dashboard.tailnet.example 换成私网里的名字，
# 证书可用 tailscale cert 签发。会话 cookie 需要 HTTPS，私网也不能用普通 http。

server {
    listen TAILNET_ADDRESS:443 ssl;
    http2 on;
    server_name dashboard.tailnet.example;

    ssl_certificate     /etc/moriium-dashboard/tls/dashboard.crt;
    ssl_certificate_key /etc/moriium-dashboard/tls/dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 30m;

    location / {
        include /etc/nginx/snippets/moriium-dashboard-proxy.conf;
    }
}
