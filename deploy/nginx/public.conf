# 公网子域名 + HTTPS + 登录。把 dashboard.example.com 换成选定的子域名，
# 证书路径换成实际签发的位置（例如 certbot）。服务只监听 127.0.0.1:5180。

# 登录接口在 Nginx 再限一次速；应用自己还有持久的账户与全局限速。
limit_req_zone $binary_remote_addr zone=moriium_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 应用自己设置 CSP 等安全头；这里只补 HSTS。
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # 导入接口最多 20 个文件 × 1 MiB（base64 后约 28 MiB）。
    client_max_body_size 30m;

    location = /api/auth/login {
        limit_req zone=moriium_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/moriium-dashboard-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/moriium-dashboard-proxy.conf;
    }
}
